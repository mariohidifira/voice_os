[project]
name = "voiceos"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1", "alembic>=1.14,<2", "pydantic-settings>=2.7,<3",
  "pyjwt[crypto]>=2.10,<3", "httpx>=0.28,<1", "redis>=5.2,<6",
  "structlog>=24.4,<26", "jinja2>=3.1,<4", "jsonschema>=4.23,<5",
  "opentelemetry-distro[otlp]>=0.59b0,<1", "opentelemetry-instrumentation-fastapi>=0.59b0,<1",
  "sentry-sdk[fastapi]>=2.0,<3"
]
[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "pytest-cov>=6,<7", "mypy>=1.14,<2", "ruff>=0.9,<1"]
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
package-dir = {voiceos_api = "apps/api/voiceos_api", voiceos_shared = "packages/shared-py/voiceos_shared"}
packages = ["voiceos_api", "voiceos_shared"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["apps/api", "packages/shared-py"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
[tool.mypy]
python_version = "3.12"
strict = true
files = ["apps/api/voiceos_api", "packages/shared-py/voiceos_shared"]
