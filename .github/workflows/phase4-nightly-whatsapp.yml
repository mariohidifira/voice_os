name: phase4-nightly-whatsapp
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: voiceos
          POSTGRES_PASSWORD: voiceos
          POSTGRES_DB: voiceos
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: pip install -e '.[dev]'
      - run: npm ci
      - run: npm run generate-types
      - run: alembic -c apps/api/alembic.ini upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://voiceos:voiceos@localhost:5432/voiceos
      - run: python apps/api/scripts/seed.py
        env:
          DATABASE_URL: postgresql+asyncpg://voiceos:voiceos@localhost:5432/voiceos
      - name: Run Phase 4 deterministic WhatsApp and simulator suite
        run: |
          mkdir -p reports
          pytest -q tests/test_whatsapp_gateway.py tests/test_whatsapp_runtime.py tests/test_api.py -k "whatsapp or simulation" --junitxml=reports/phase4-nightly-whatsapp.xml
      - run: npx playwright install --with-deps chromium
      - name: Run consolidated Phase 4 local acceptance flow
        run: python scripts/run_phase4_local_acceptance.py
      - name: Build Phase 4 evidence summary
        run: python scripts/build_phase4_evidence_summary.py
      - name: Build Phase 4 evidence package
        run: python scripts/build_phase4_evidence_package.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase4-nightly-whatsapp
          path: |
            reports/phase4-nightly-whatsapp.xml
            reports/phase4-local-acceptance.json
            reports/phase4-evidence-summary.json
            reports/phase4-evidence-bundle.manifest.json
            reports/phase4-evidence-bundle.zip
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: error
